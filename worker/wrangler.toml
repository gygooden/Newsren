name = "newsren-agent"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Secrets (never committed): set with
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RATE_LIMIT_SALT
#   npx wrangler secret put MODERATOR_TOKEN   (approves community notes)
# For local development, copy .dev.vars.example to .dev.vars.

[vars]
ANTHROPIC_MODEL = "claude-haiku-5-5"
# Comma-separated. Replace with your GitHub Pages origin, e.g. https://<user>.github.io
ALLOWED_ORIGIN = "https://gygooden.github.io,http://localhost:3000"
DAILY_GLOBAL_LIMIT = "50"
DAILY_PER_VISITOR_LIMIT = "3"

# Create with: npx wrangler kv namespace create LIMITS
# then paste the returned id below.
[[kv_namespaces]]
binding = "LIMITS"
id = "0f373d51c5604677a859ed02fa0b815b"

[observability]
enabled = false
